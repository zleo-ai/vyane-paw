name: candidate compatibility

on:
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyane-rs-candidate-compatibility
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Probe current vyane-rs main
        env:
          VYANE_PAW_RUNTIME_DIR: >-
            ${{ runner.temp }}/vyane-paw-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}
        run: ./scripts/run-vp06-container.sh
