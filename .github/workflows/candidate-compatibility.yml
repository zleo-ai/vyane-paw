name: candidate compatibility

on:
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyane-rs-candidate-compatibility
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: [self-hosted, vyane-paw]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Probe current vyane-rs main
        run: ./scripts/run-vp06.sh
