name: quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    runs-on: [self-hosted, vyane-paw]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Validate repository
        run: ./scripts/check-repository.sh
      - name: Run compatibility, demo-flow, and product-entry smoke
        run: ./scripts/run-vp03.sh

  candidate:
    runs-on: [self-hosted, vyane-paw]
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Probe current vyane-rs main
        run: ./scripts/run-vp06.sh
