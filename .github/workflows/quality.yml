name: quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    runs-on: [self-hosted, vyane-paw]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Validate repository
        run: ./scripts/check-repository.sh
      - name: Run VP-01 compatibility and VP-02 demo-flow smoke
        run: ./scripts/run-vp02.sh
