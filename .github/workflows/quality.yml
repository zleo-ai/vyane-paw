name: quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: [self-hosted, vyane-paw]
    steps:
      - uses: actions/checkout@v6
      - name: Validate repository
        run: ./scripts/check-repository.sh
      - name: Run VP-01 compatibility smoke
        run: ./scripts/run-vp01.sh
